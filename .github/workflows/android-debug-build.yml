name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.3 stable and export templates
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          curl -L --fail -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d templates_unpack
          cp -R templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ./godot --version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Validate packaging contract
        run: python3 tools/validate_android_packaging.py

      - name: Import project
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-android-import.log
          ! grep -q "ERROR:" godot-android-import.log

      - name: Export debug APK
        run: |
          mkdir -p build/android
          set -o pipefail
          ./godot --headless --path . --export-debug "Android" build/android/Orlumi-Petal-Nook.apk 2>&1 | tee godot-android-export.log
          test -s build/android/Orlumi-Petal-Nook.apk
          ! grep -q "ERROR:" godot-android-export.log

      - name: Record APK checksum
        run: sha256sum build/android/Orlumi-Petal-Nook.apk | tee build/android/Orlumi-Petal-Nook.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orlumi-Petal-Nook-Android-debug
          path: |
            build/android/Orlumi-Petal-Nook.apk
            build/android/Orlumi-Petal-Nook.apk.sha256
          if-no-files-found: error
          retention-days: 14
