name: Godot Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production asset contracts
        run: python3 tools/validate_assets.py

      - name: Install Godot 4.3 stable
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and parse project
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          ! grep -q "ERROR:" godot-import.log

      - name: Run core smoke assertions
        run: |
          set -o pipefail
          ./godot --headless --path . game/tests/smoke_test.tscn 2>&1 | tee godot-smoke.log
          ! grep -q "ERROR:" godot-smoke.log

      - name: Boot main scene
        run: |
          set -o pipefail
          ./godot --headless --path . --quit-after 10 2>&1 | tee godot-boot.log
          ! grep -q "ERROR:" godot-boot.log
